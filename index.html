<!doctype html>
<html lang="en-AU">

      name="description"
      content="Shine Motor Corporation — scrap metal buyers in Ingleburn, NSW. Copper, brass, aluminium, stainless and ferrous bought by grade at Sydney's top rates. Instant EFT. We'll beat any genuine quote."
    />
    <meta name="theme-color" content="#08080a" />
    <!-- Favicons. The SVG is the wave from the Shine Motor wordmark, traced to
         vector so it stays crisp at any size; the .ico carries 16/32/48 rasters
         for browsers and Google Search, which still request /favicon.ico. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / social. Duplicated per route by src/lib/seo.ts once the app
         hydrates; these static copies are what social scrapers and non-JS
         crawlers read, since they do not execute the bundle. -->
    <meta property="og:site_name" content="Shine Motor Corporation" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:url" content="https://shinemotor.com.au/" />
    <meta property="og:title" content="Scrap Metal Buyers Sydney — Top Prices, Paid on the Spot" />
    <meta property="og:description" content="Shine Motor Corporation buys copper, brass, aluminium, stainless and steel by grade at Ingleburn, NSW. Weighed in front of you, instant EFT, free pickup across NSW &amp; ACT." />
    <meta property="og:image" content="https://shinemotor.com.au/img/Scrap-Metal-banner.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://shinemotor.com.au/img/Scrap-Metal-banner.webp" />

    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="geo.region" content="AU-NSW" />
    <meta name="geo.placename" content="Ingleburn" />
    <meta name="geo.position" content="-33.9890097;150.8625991" />
    <link rel="canonical" href="https://shinemotor.com.au/" />
